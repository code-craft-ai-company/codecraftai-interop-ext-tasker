[tool.poetry]
name = "codecraftai-interop-ext-tasker"
description = "Code Craft AI - Tasker Interop Extensions"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-interop = { git = "https://github.com/automationmojo/codecraftai-interop.git", branch = "main" }
codecraftai-landscaping = { git = "https://github.com/automationmojo/codecraftai-landscaping.git", branch = "main" }
codecraftai-testplus = { git = "https://github.com/automationmojo/codecraftai-testplus.git", branch = "main" }


[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
