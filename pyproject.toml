[tool.poetry]
name = "codecraftai-interop-ext-tasker"
description = "Code Craft AI - Tasker Interop Extensions"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-interop = { git = "https://github.com/code-craft-ai-company/codecraftai-interop.git", branch = "main" }
codecraftai-landscaping = { git = "https://github.com/code-craft-ai-company/codecraftai-landscaping.git", branch = "main" }
codecraftai-testplus = { git = "https://github.com/code-craft-ai-company/codecraftai-testplus.git", branch = "main" }
codecraftai-testbase = { git = "https://github.com/code-craft-ai-company/codecraftai-testbase.git", branch = "main" }
rpyc = "^6.0.1"
psutil = "^7.2.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
